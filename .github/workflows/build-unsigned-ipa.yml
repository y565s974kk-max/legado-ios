name: build-unsigned-ipa

# 在个人 fork 中一键产出未签名 IPA（用自己的 Apple ID 签名后安装）
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "构建配置"
        required: false
        default: Release
      runner:
        description: "Runner 标签（容量不足时可换 macos-15）"
        required: false
        default: macos-26
      xcode:
        description: "优先使用的 Xcode 版本（留空=镜像默认）"
        required: false
        default: "26.1.1"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          WANT="${{ inputs.xcode }}"
          echo "--- installed Xcode ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          if [ -n "$WANT" ] && [ -d "/Applications/Xcode_${WANT}.app" ]; then
            echo "selecting Xcode_${WANT}.app"
            sudo xcode-select -s "/Applications/Xcode_${WANT}.app"
          else
            echo "wanted Xcode '${WANT}' not present, keeping default"
          fi

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -project Legado.xcodeproj -list

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild -project Legado.xcodeproj \
            -scheme Legado \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$PWD/.spm-cache"

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Legado.xcodeproj \
            -scheme Legado \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/.spm-cache" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          CONFIG="${{ inputs.configuration }}"
          APP="DerivedData/Build/Products/${CONFIG}-iphoneos/Legado.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到构建产物 $APP"
            find DerivedData/Build/Products -maxdepth 2 -name "*.app" || true
            exit 1
          fi

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          MIN_IOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          echo "bundle=$BUNDLE_ID version=$VERSION build=$BUILD min_ios=$MIN_IOS"

          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          NAME="legado-ios-v${VERSION}-b${BUILD}-unsigned.ipa"
          ( cd out && zip -qry "$NAME" Payload )
          shasum -a 256 "out/$NAME" | tee out/SHA256SUMS

          echo "ipa_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "min_ios=$MIN_IOS" >> "$GITHUB_OUTPUT"
          ls -lh out

      - name: Verify IPA contents
        run: |
          set -euo pipefail
          NAME="${{ steps.package.outputs.ipa_name }}"
          rm -rf verify && mkdir verify
          ( cd verify && unzip -q "../out/$NAME" )
          APP=verify/Payload/Legado.app
          test -f "$APP/Legado" || { echo "::error::缺少主二进制"; exit 1; }
          echo "--- arch ---"
          lipo -info "$APP/Legado"
          echo "--- signature (应为未签名) ---"
          codesign -dv "$APP" 2>&1 || echo "(未签名)"
          echo "--- 描述文件检查 ---"
          ls "$APP/embedded.mobileprovision" 2>/dev/null && echo "::warning::包含描述文件" || echo "无描述文件（符合预期）"
          du -sh "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-ios-unsigned-ipa
          path: |
            out/${{ steps.package.outputs.ipa_name }}
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
